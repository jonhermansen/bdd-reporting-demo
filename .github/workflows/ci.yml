name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  test:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-14, macos-26]
      fail-fast: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Runner probe
        uses: ./.github/actions/runner-probe
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run tests
        continue-on-error: true
        run: npm test
      - name: Flaky report
        if: always()
        uses: ./.github/actions/flaky-report
        with:
          report: reports/ctrf.json
          history-artifact: flaky-history-${{ matrix.runner }}-${{ github.ref_name }}
