name: 'Runner Probe'
description: 'Probe host OS, CPU, and cloud metadata (Azure/AWS/GCP IMDS) for the current runner'

runs:
  using: composite
  steps:
    - name: Probe
      shell: bash
      run: |
        set +e
        {
          echo "## 🖥️ Runner Probe — \`${RUNNER_OS}\` / \`${RUNNER_ARCH}\`"
          echo
          echo "### uname"
          echo '```'
          uname -a
          echo '```'

          echo "### CPU / memory"
          echo '```'
          if [ "$RUNNER_OS" = "Linux" ]; then
            nproc
            grep -m1 'model name' /proc/cpuinfo || true
            free -h | head -2
          elif [ "$RUNNER_OS" = "macOS" ]; then
            sysctl -n hw.ncpu hw.physicalcpu hw.memsize machdep.cpu.brand_string
          fi
          echo '```'

          if [ "$RUNNER_OS" = "Linux" ]; then
            echo "### DMI"
            echo '```'
            for f in system-manufacturer system-product-name system-version bios-vendor; do
              printf '%-22s %s\n' "$f:" "$(sudo dmidecode -s "$f" 2>/dev/null | head -1)"
            done
            echo '```'
          fi

          echo "### Azure IMDS"
          echo '```json'
          RESP=$(curl -sS -m 3 -H "Metadata: true" \
            "http://169.254.169.254/metadata/instance?api-version=2021-02-01" 2>/dev/null)
          if [ -n "$RESP" ] && command -v jq >/dev/null && echo "$RESP" | jq . >/dev/null 2>&1; then
            echo "$RESP" | jq '.compute | {vmSize, sku, location, zone, vmId, offer, publisher, osType, platformFaultDomain}'
          else
            echo "${RESP:-(no response — not on Azure or IMDS unreachable)}"
          fi
          echo '```'

          echo "### AWS IMDSv2"
          echo '```'
          TOKEN=$(curl -sS -m 3 -X PUT "http://169.254.169.254/latest/api/token" \
            -H "X-aws-ec2-metadata-token-ttl-seconds: 60" 2>/dev/null)
          if [ -n "$TOKEN" ]; then
            for k in instance-type instance-id placement/availability-zone placement/region; do
              printf '%-32s %s\n' "$k:" \
                "$(curl -sS -m 3 -H "X-aws-ec2-metadata-token: $TOKEN" \
                    "http://169.254.169.254/latest/meta-data/$k" 2>/dev/null || echo '(none)')"
            done
          else
            echo "(no AWS IMDS token — not on AWS)"
          fi
          echo '```'

          echo "### GCP metadata"
          echo '```'
          for k in instance/machine-type instance/zone project/project-id; do
            V=$(curl -sS -m 3 -H "Metadata-Flavor: Google" \
              "http://metadata.google.internal/computeMetadata/v1/$k" 2>/dev/null)
            printf '%-24s %s\n' "$k:" "${V:-(none)}"
          done
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
