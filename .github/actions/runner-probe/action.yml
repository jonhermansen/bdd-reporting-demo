name: 'Runner Probe'
description: 'Probe host OS, CPU, and IMDS metadata for the current runner'

runs:
  using: composite
  steps:
    - name: Probe
      shell: bash
      run: |
        set +e
        {
          echo "## 🖥️ Runner Probe — \`${RUNNER_OS}\` / \`${RUNNER_ARCH}\`"
          echo
          echo "### uname"
          echo '```'
          uname -a
          echo '```'

          echo "### CPU / memory"
          echo '```'
          if [ "$RUNNER_OS" = "Linux" ]; then
            nproc
            grep -m1 'model name' /proc/cpuinfo || true
            grep -m1 -E 'Model|Hardware|CPU' /proc/cpuinfo || true
            free -h | head -2
          elif [ "$RUNNER_OS" = "macOS" ]; then
            sysctl -n hw.ncpu hw.physicalcpu hw.memsize machdep.cpu.brand_string
          fi
          echo '```'

          echo "### Hypervisor"
          echo '```'
          if [ "$RUNNER_OS" = "Linux" ]; then
            printf 'systemd-detect-virt: %s\n' "$(systemd-detect-virt 2>/dev/null || echo '(not available)')"
            printf 'lscpu hypervisor:    %s\n' "$(lscpu 2>/dev/null | awk -F: '/Hypervisor vendor/{gsub(/^ +/,"",$2); print $2}')"
            printf 'lscpu virt type:     %s\n' "$(lscpu 2>/dev/null | awk -F: '/Virtualization type/{gsub(/^ +/,"",$2); print $2}')"
            printf 'cpuinfo hypervisor:  %s\n' "$(grep -m1 -o 'hypervisor' /proc/cpuinfo || echo '(flag not set)')"
          elif [ "$RUNNER_OS" = "macOS" ]; then
            printf 'kern.hv_vmm_present: %s\n' "$(sysctl -n kern.hv_vmm_present 2>/dev/null)"
            printf 'hw.optional.vmm:     %s\n' "$(sysctl -n hw.optional.vmm 2>/dev/null)"
            printf 'kern.osproductversion: %s\n' "$(sysctl -n kern.osproductversion 2>/dev/null)"
          fi
          echo '```'

          if [ "$RUNNER_OS" = "Linux" ]; then
            echo "### DMI"
            echo '```'
            for f in system-manufacturer system-product-name system-version bios-vendor; do
              printf '%-22s %s\n' "$f:" "$(sudo dmidecode -s "$f" 2>/dev/null | head -1)"
            done
            echo '```'
          fi

          echo "### IMDS"
          # Try each known IMDS endpoint + auth combo. Print whatever answers.
          probe_imds() {
            local label="$1" url="$2"; shift 2
            local resp
            resp=$(curl -sS -m 3 "$@" "$url" 2>/dev/null)
            if [ -n "$resp" ]; then
              echo "#### $label — $url"
              echo '```'
              if command -v jq >/dev/null && echo "$resp" | jq . >/dev/null 2>&1; then
                echo "$resp" | jq .
              else
                echo "$resp"
              fi
              echo '```'
            fi
          }

          # 169.254.169.254 — the common link-local IMDS (Azure/AWS/GCP/others)
          probe_imds "instance metadata (Metadata: true header)" \
            "http://169.254.169.254/metadata/instance?api-version=2021-02-01" \
            -H "Metadata: true"

          probe_imds "instance metadata (Metadata-Flavor: Google header)" \
            "http://169.254.169.254/computeMetadata/v1/?recursive=true" \
            -H "Metadata-Flavor: Google"

          TOKEN=$(curl -sS -m 3 -X PUT \
            -H "X-aws-ec2-metadata-token-ttl-seconds: 60" \
            "http://169.254.169.254/latest/api/token" 2>/dev/null)
          if [ -n "$TOKEN" ]; then
            probe_imds "instance metadata (token-auth)" \
              "http://169.254.169.254/latest/dynamic/instance-identity/document" \
              -H "X-aws-ec2-metadata-token: $TOKEN"
          fi

          # 169.254.42.42 — alternate IMDS address used by some providers
          probe_imds "instance metadata (alt endpoint)" \
            "http://169.254.42.42/conf?format=json"

          echo
          echo "_(sections above only appear for endpoints that responded)_"
        } | tee -a "$GITHUB_STEP_SUMMARY"
